name: Refresh data snapshot

# Recomputes scores/triggers and commits the updated dashboard snapshot (which
# triggers a Vercel redeploy). If the RSI_DATABASE_URL secret is set, the same
# run also writes to Supabase.
#
# Cadence is tiered by how fast/cheap each source is to refresh from CI:
#   * DAILY (fast, free): UN Comtrade trade flows + recompute + republish. Keeps
#     the dashboard's "Updated" date and trade signals current every day.
#   * WEEKLY (Mondays): also refresh Google Trends. It goes through the Apify
#     google-trends-scraper actor (reliable from CI datacenter IPs, but ~20-30
#     min and a few Apify credits per run), so it is NOT run every day.
#   * OPT-IN per run: the paid Apify social/marketplace feeds (TikTok/Instagram/
#     Pinterest/Amazon/AliExpress) — only via manual dispatch with `apify=true`.
# Manual "Run workflow" is fast by default; tick `trends` to also refresh Google
# Trends on demand.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC — fast: Comtrade + recompute
  workflow_dispatch:
    inputs:
      trends:
        description: "Also refresh Google Trends (slower ~20-30 min, uses a few Apify credits)"
        type: boolean
        default: false
      apify:
        description: "Also ingest paid Apify social/marketplace feeds (TikTok/Instagram/Pinterest/Amazon/AliExpress) — consumes credits"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Optional secrets — unset => SQLite + Comtrade preview endpoint + the
      # deterministic insight narrative (no LLM) + Apify connectors no-op.
      RSI_DATABASE_URL: ${{ secrets.RSI_DATABASE_URL }}
      RSI_COMTRADE_API_KEY: ${{ secrets.RSI_COMTRADE_API_KEY }}
      RSI_ANTHROPIC_API_KEY: ${{ secrets.RSI_ANTHROPIC_API_KEY }}
      RSI_APIFY_TOKEN: ${{ secrets.RSI_APIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        working-directory: pipelines
        run: uv sync --extra postgres --extra llm

      - name: Run pipeline (refresh demand -> recompute -> publish)
        working-directory: pipelines
        # `db init` is idempotent (create_all) and ensures the schema exists.
        # `export` publishes the snapshot row to Supabase when RSI_DATABASE_URL
        # is set. Each connector degrades gracefully (`|| true`) so one flaky
        # source never aborts the run.
        run: |
          uv run rsi db init
          # UN Comtrade (trade flows) is fast + free — refresh every day.
          uv run rsi ingest comtrade --days 60 || true
          # Google Trends runs through the Apify actor (reliable from CI but slow
          # + a few credits), so refresh it weekly (Mondays) or on demand only.
          if [ "$(date -u +%u)" = "1" ] || [ "${{ inputs.trends }}" = "true" ]; then
            echo "::notice::Refreshing Google Trends via the Apify actor (slow)"
            uv run rsi ingest google_trends --days 60 || true
          fi
          # Paid social/marketplace feeds — manual dispatch with apify=true only.
          if [ "${{ inputs.apify }}" = "true" ]; then
            echo "::notice::Ingesting paid Apify social/marketplace feeds"
            uv run rsi ingest tiktok instagram pinterest amazon aliexpress --days 60 || true
          fi
          uv run rsi score
          uv run rsi correlate
          uv run rsi insights
          uv run rsi export

      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- web/lib/snapshot.json; then
            echo "Snapshot unchanged — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/lib/snapshot.json
            git commit -m "chore(data): snapshot refresh"
            # `main` can advance during the run, so rebase the snapshot commit
            # onto the latest main before pushing — otherwise the push fails
            # non-fast-forward and the committed copy goes stale.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "push attempt $attempt failed; retrying after rebase…"
              git rebase --abort 2>/dev/null || true
              sleep 3
            done
          fi
