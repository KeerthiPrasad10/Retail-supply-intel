name: Refresh data snapshot

# Recomputes scores/triggers from the data already in the store and commits
# the updated dashboard snapshot (which triggers a Vercel redeploy). No
# external fetches here, so it can't be blocked by a slow/hanging source —
# ingestion runs separately in ingest.yml (an hour earlier) and this job
# picks up whatever it wrote.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional secrets — unset => SQLite + the deterministic insight
      # narrative (no LLM).
      RSI_DATABASE_URL: ${{ secrets.RSI_DATABASE_URL }}
      RSI_ANTHROPIC_API_KEY: ${{ secrets.RSI_ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        working-directory: pipelines
        run: uv sync --extra postgres --extra llm

      - name: Recompute and publish
        working-directory: pipelines
        # `db init` is idempotent (create_all). `export` also publishes the
        # snapshot row to Supabase when RSI_DATABASE_URL is set.
        run: |
          uv run rsi db init
          uv run rsi score
          uv run rsi correlate
          uv run rsi insights
          uv run rsi export

      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- web/lib/snapshot.json; then
            echo "Snapshot unchanged — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/lib/snapshot.json
            git commit -m "chore(data): snapshot refresh"
            # `main` can advance during the run, so rebase the snapshot commit
            # onto the latest main before pushing — otherwise the push fails
            # non-fast-forward and the committed copy goes stale.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              echo "push attempt $attempt failed; retrying after rebase…"
              git rebase --abort 2>/dev/null || true
              sleep 3
            done
          fi
